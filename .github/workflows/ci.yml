name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run frontend regression checks
        run: |
          for test in scripts/tests/*.mjs; do
            node "$test"
          done
      - run: npm run build

  security:
    name: Dependency and security regression gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=high
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: python3 scripts/tests/security-regressions.py
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
