name: Build and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and publish (for example v0.4.25)
        required: true
        type: string
      macos_only:
        description: Retry macOS only, keeping the existing Windows installers
        type: boolean
        default: false
  push:
    # Tags can restore default-branch caches, but not caches from other tags.
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.macos_only && '["macos-latest"]' || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      # Use the same native compiler settings for tests and release builds.
      # M1 baseline avoids ggml i8mm errors and supports every Apple Silicon Mac.
      CFLAGS: ${{ matrix.platform == 'macos-latest' && '-mcpu=apple-m1' || '' }}
      CXXFLAGS: ${{ matrix.platform == 'macos-latest' && '-mcpu=apple-m1' || '' }}
      RUSTFLAGS: ${{ matrix.platform == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - name: Validate a manual release retry
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != refs/heads/main || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Run this workflow from main with an existing version tag, such as v0.4.25."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Retry the exact tagged source using the workflow fixes on main.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # rust-cache removes non-Cargo files under target when saving. This action
      # must come after it so its post-step saves the native libraries first.
      - name: Restore Sherpa native libraries
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Refresh Sherpa linking after cache restore
        shell: bash
        env:
          SHERPA_CACHE_HIT: ${{ steps.sherpa-cache.outputs.cache-hit }}
        run: |
          # Old Rust caches can contain empty library directories and stale link
          # metadata. Re-run only this package's build script, keeping other crates.
          if [[ "$SHERPA_CACHE_HIT" != true ]]; then
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
          fi
          cargo clean --release --package sherpa-onnx-sys --manifest-path src-tauri/Cargo.toml

      - run: npm ci

      - name: Install Metal compiler for the bundled Patter intelligence runtime
        if: matrix.platform == 'macos-latest'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Identify the native toolchain
        if: matrix.platform == 'macos-latest'
        id: native-toolchain
        run: |
          {
            xcodebuild -version
            xcrun --show-sdk-build-version
            xcrun metal --version | sed -n '1,2p'
            sw_vers -productVersion
          } > "$RUNNER_TEMP/patter-toolchain.txt"
          echo "fingerprint=$(shasum -a 256 "$RUNNER_TEMP/patter-toolchain.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore the Swift and Metal build cache
        if: matrix.platform == 'macos-latest'
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native/patter-intelligence/.build/xcode
          key: mlx-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.fingerprint }}-${{ hashFiles('native/patter-intelligence/Package.resolved') }}-${{ hashFiles('native/patter-intelligence/Package.swift', 'native/patter-intelligence/Sources/**', 'native/patter-intelligence/licenses/**', 'scripts/build-intelligence.mjs') }}
          restore-keys: |
            mlx-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.fingerprint }}-${{ hashFiles('native/patter-intelligence/Package.resolved') }}-

      # Tauri validates bundled resource paths even when compiling unit tests.
      # Always run Xcode's dependency checks, including after a cache restore.
      - name: Build the bundled Patter intelligence runtime
        if: matrix.platform == 'macos-latest'
        run: npm run build:intelligence

      - name: Run regression tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify the pinned Nano model on Apple Silicon
        if: matrix.platform == 'macos-latest'
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml built_in::tests::nano_bundled_runtime_smoke -- --ignored --exact --nocapture

      - name: Verify Nano channel activation and rollback
        if: matrix.platform == 'macos-latest'
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml built_in::updates::tests::channel_install_probe_failure_and_rollback_smoke -- --ignored --exact --nocapture

      - name: Build the app and warm release dependencies on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run tauri -- build --no-bundle

      - name: Save the Swift and Metal build cache on main
        if: matrix.platform == 'macos-latest' && github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/patter-intelligence/.build/xcode
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      # Self-signed (not Apple Developer ID) codesigning, macOS only. Without
      # this, every release is signed ad-hoc with a fresh identity each build,
      # so macOS TCC treats each update as a "new app" and drops the user's
      # Accessibility/Input Monitoring grants — this keeps the signing identity
      # stable across releases so those grants survive updates. Gatekeeper's
      # "unidentified developer" warning is unaffected; that needs a paid
      # Apple Developer ID + notarization, which this is not.
      - name: Import macOS signing certificate
        if: matrix.platform == 'macos-latest' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_PATH=$RUNNER_TEMP/cert.p12

          echo "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # Builds the .app/.dmg, plus .app.tar.gz + .sig updater artifacts and
      # latest.json (createUpdaterArtifacts). Self-signed on macOS (see above)
      # — still not notarized, so Gatekeeper still flags it as unidentified.
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && 'Patter Local Signing' || '' }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Patter ${{ env.RELEASE_TAG }}"
          # The tag already exists and pins the source. GitHub still checks
          # target_commitish permissions; an older SHA can need workflows:write.
          releaseCommitish: main
          # Publish immediately: pushing a v* tag IS the release decision.
          # Installed apps see the update as soon as the build finishes.
          releaseDraft: false
          # Beta/RC tags stay opt-in; the stable updater points at releases/latest.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          # ponytail: Apple Silicon only — universal needs x86_64 cross-compile
          # of sherpa-onnx/whisper.cpp native libs; add when Intel users ask.

      - name: Preserve installers if release publishing fails
        if: failure() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: ignore
          retention-days: 7
